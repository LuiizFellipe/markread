<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MarkRead</title>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar" hidden>
        <div id="side-header">
          <div id="side-logo" aria-hidden="true">M&#8595;</div>
          <span id="side-title">MarkRead</span>
          <button type="button" id="side-collapse" data-i18n-title="hideSidebar" title="Hide sidebar" aria-label="Hide sidebar">
            <svg viewBox="0 0 24 24"><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></svg>
          </button>
        </div>
        <nav id="side-actions" aria-label="Actions">
          <button type="button" class="side-row" id="act-new-file">
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
            <span data-i18n="actNewFile">New file</span><kbd>Ctrl+N</kbd>
          </button>
          <button type="button" class="side-row" id="act-open">
            <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
            <span data-i18n="actOpenFile">Open file</span><kbd>Ctrl+O</kbd>
          </button>
          <button type="button" class="side-row" id="act-open-folder">
            <svg viewBox="0 0 24 24"><path d="M6 14l1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v1"/></svg>
            <span data-i18n="actOpenFolder">Open folder</span><kbd>Ctrl+Alt+O</kbd>
          </button>
          <button type="button" class="side-row" id="act-find">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
            <span data-i18n="actFind">Find</span><kbd>Ctrl+F</kbd>
          </button>
          <button type="button" class="side-row" id="act-edit">
            <svg viewBox="0 0 24 24"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg>
            <span data-i18n="actEdit">Edit</span><kbd>Ctrl+E</kbd>
          </button>
          <button type="button" class="side-row" id="act-save">
            <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            <span data-i18n="actSave">Save</span><kbd>Ctrl+S</kbd>
          </button>
          <button type="button" class="side-row" id="act-print">
            <svg viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
            <span data-i18n="actPrint">Print</span><kbd>Ctrl+P</kbd>
          </button>
          <div class="side-row" id="zoom-row">
            <span data-i18n="actZoom">Zoom</span>
            <span id="zoom-controls">
              <button type="button" id="zoom-out-btn" aria-label="Zoom out">&minus;</button>
              <span id="zoom-label">100%</span>
              <button type="button" id="zoom-in-btn" aria-label="Zoom in">+</button>
              <button type="button" id="zoom-reset-btn" aria-label="Reset zoom">&#8634;</button>
            </span>
          </div>
        </nav>

        <div class="side-group" id="group-outline">
          <button type="button" class="group-header" aria-expanded="true">
            <span data-i18n="outlineTitle">Outline</span>
            <svg class="chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="group-body">
            <nav id="outline" aria-label="Table of contents"></nav>
          </div>
        </div>

        <div class="side-group" id="group-files" hidden>
          <button type="button" class="group-header" aria-expanded="true">
            <span data-i18n="filesTitle">Folder</span>
            <svg class="chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="group-body">
            <div id="files-header">
              <div id="folder-name" hidden></div>
            </div>
            <input
              id="folder-search"
              type="text"
              autocomplete="off"
              spellcheck="false"
              hidden
              data-i18n-placeholder="searchFolderPlaceholder"
            />
            <nav id="file-list"></nav>
          </div>
        </div>

        <div class="side-group" id="group-recents">
          <button type="button" class="group-header" aria-expanded="true">
            <span data-i18n="recentFiles">Recent</span>
            <svg class="chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="group-body">
            <ul id="recent-list"></ul>
            <p id="recent-empty" data-i18n="noRecent" hidden>No recent files</p>
            <button id="clear-recent" class="link-btn" data-i18n="clearRecent" hidden>Clear</button>
          </div>
        </div>

        <div id="side-footer">
          <div id="theme-segment" role="group" aria-label="Theme">
            <button type="button" data-theme-pref="light" title="Light">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="4.2" y1="4.2" x2="6.3" y2="6.3"/><line x1="17.7" y1="17.7" x2="19.8" y2="19.8"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/><line x1="4.2" y1="19.8" x2="6.3" y2="17.7"/><line x1="17.7" y1="6.3" x2="19.8" y2="4.2"/></svg>
            </button>
            <button type="button" data-theme-pref="dark" title="Dark">
              <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            </button>
            <button type="button" data-theme-pref="system" title="System">
              <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="13" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
            </button>
          </div>
          <select id="lang-select" aria-label="Language">
            <option value="en">English</option>
            <option value="pt-BR">Português (Brasil)</option>
            <option value="es">Español</option>
          </select>
        </div>
      </aside>
      <div id="sidebar-resizer" aria-hidden="true"></div>
      <button type="button" id="side-float-open" hidden data-i18n-title="showSidebar" title="Show sidebar" aria-label="Show sidebar">
        <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div id="content-wrap">
        <div id="update-banner" role="status" hidden>
          <span id="update-banner-text"></span>
          <button id="update-open" class="link-btn" data-i18n="updateViewRelease">View release</button>
          <button id="update-close" class="icon-btn" aria-label="Dismiss">&#10005;</button>
        </div>
        <div id="findbar" hidden>
          <div id="find-row">
            <input
              id="find-input"
              type="text"
              autocomplete="off"
              spellcheck="false"
              data-i18n-placeholder="searchPlaceholder"
            />
            <span id="find-count"></span>
            <button id="find-prev" class="icon-btn" data-i18n-title="findPrev" title="Previous match (Shift+Enter)">&#8593;</button>
            <button id="find-next" class="icon-btn" data-i18n-title="findNext" title="Next match (Enter)">&#8595;</button>
            <button id="find-close" class="icon-btn" data-i18n-title="findClose" title="Close (Esc)">&#10005;</button>
          </div>
          <div id="replace-row" hidden>
            <input
              id="replace-input"
              type="text"
              autocomplete="off"
              spellcheck="false"
              data-i18n-placeholder="replacePlaceholder"
            />
            <button id="replace-one" class="findbar-action" data-i18n="replaceBtn">Replace</button>
            <button id="replace-all" class="findbar-action" data-i18n="replaceAllBtn">Replace all</button>
          </div>
        </div>
        <div id="scroll-pane">
          <div id="reading-progress" hidden aria-hidden="true"></div>
          <section id="welcome">
            <div id="welcome-logo" aria-hidden="true">M&#8595;</div>
            <h1 data-i18n="welcomeTitle">MarkRead</h1>
            <p id="welcome-subtitle" data-i18n="welcomeSubtitle">A clean Markdown reader</p>
            <button id="welcome-open" data-i18n="openFile">Open File&#8230;</button>
            <button id="welcome-new" class="welcome-secondary" data-i18n="actNewFile">New file</button>
            <button id="welcome-folder" class="welcome-secondary" data-i18n="openFolder">Open Folder&#8230;</button>
            <p id="welcome-drop" data-i18n="dropHint">Drop a .md file here, or press Ctrl+O</p>
          </section>
          <article id="markdown-body" class="markdown-body" hidden></article>
        </div>
        <div id="editor-area" hidden>
          <div id="editor-toolbar" role="toolbar">
            <button type="button" class="tb-btn" data-cmd="undo" data-i18n-title="tbUndo" title="Undo">
              <svg viewBox="0 0 24 24"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>
            </button>
            <button type="button" class="tb-btn" data-cmd="redo" data-i18n-title="tbRedo" title="Redo">
              <svg viewBox="0 0 24 24"><polyline points="15 14 20 9 15 4"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/></svg>
            </button>
            <span class="tb-sep" aria-hidden="true"></span>
            <button type="button" class="tb-btn" data-cmd="bold" data-i18n-title="tbBold" title="Bold (Ctrl+B)"><span class="glyph-b">B</span></button>
            <button type="button" class="tb-btn" data-cmd="italic" data-i18n-title="tbItalic" title="Italic (Ctrl+I)"><span class="glyph-i">I</span></button>
            <button type="button" class="tb-btn" data-cmd="strikethrough" data-i18n-title="tbStrikethrough" title="Strikethrough"><span class="glyph-s">S</span></button>
            <button type="button" class="tb-btn" data-cmd="heading" data-i18n-title="tbHeading" title="Heading"><span class="glyph-h">H</span></button>
            <span class="tb-sep" aria-hidden="true"></span>
            <button type="button" class="tb-btn" data-cmd="bullet-list" data-i18n-title="tbBulletList" title="Bullet list">
              <svg viewBox="0 0 24 24"><line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/><circle class="tb-dot" cx="4.5" cy="6" r="1.4"/><circle class="tb-dot" cx="4.5" cy="12" r="1.4"/><circle class="tb-dot" cx="4.5" cy="18" r="1.4"/></svg>
            </button>
            <button type="button" class="tb-btn" data-cmd="numbered-list" data-i18n-title="tbNumberedList" title="Numbered list">
              <svg viewBox="0 0 24 24"><line x1="10" y1="6" x2="20" y2="6"/><line x1="10" y1="12" x2="20" y2="12"/><line x1="10" y1="18" x2="20" y2="18"/><text class="tb-num" x="2.5" y="8">1</text><text class="tb-num" x="2.5" y="14">2</text><text class="tb-num" x="2.5" y="20">3</text></svg>
            </button>
            <button type="button" class="tb-btn" data-cmd="task-list" data-i18n-title="tbTaskList" title="Task list">
              <svg viewBox="0 0 24 24"><rect x="3" y="3.5" width="8" height="8" rx="1"/><polyline points="5 7.5 6.6 9.1 9.4 5.9"/><line x1="14" y1="7.5" x2="21" y2="7.5"/><rect x="3" y="12.5" width="8" height="8" rx="1"/><line x1="14" y1="16.5" x2="21" y2="16.5"/></svg>
            </button>
            <span class="tb-sep" aria-hidden="true"></span>
            <button type="button" class="tb-btn" data-cmd="blockquote" data-i18n-title="tbBlockquote" title="Blockquote"><span class="glyph-q">&#8220;</span></button>
            <button type="button" class="tb-btn" data-cmd="code" data-i18n-title="tbCode" title="Code">
              <svg viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
            </button>
            <button type="button" class="tb-btn" data-cmd="table" data-i18n-title="tbTable" title="Table">
              <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="4" x2="9" y2="20"/><line x1="15" y1="4" x2="15" y2="20"/></svg>
            </button>
            <span class="tb-sep" aria-hidden="true"></span>
            <button type="button" class="tb-btn" data-cmd="link" data-i18n-title="tbLink" title="Link">
              <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            </button>
            <button type="button" class="tb-btn" data-cmd="image" data-i18n-title="tbImage" title="Image">
              <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            </button>
          </div>
          <div id="editor-split">
            <textarea id="editor" spellcheck="false" autocomplete="off" aria-label="Markdown source"></textarea>
            <div id="editor-split-resizer" role="separator" aria-orientation="vertical" aria-label="Resize editor and preview"></div>
            <div id="editor-preview-scroll">
              <article id="editor-preview" class="markdown-body"></article>
            </div>
          </div>
        </div>
        <button id="back-to-top" aria-label="Back to top">&#8593;</button>
      </div>
    </div>
    <footer id="statusbar">
      <span id="status-file" data-i18n="statusNoFile">No file open</span>
      <span id="status-save" hidden></span>
      <span id="status-cursor" hidden></span>
      <span id="status-meta"></span>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
